<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orari Mësimor — Shkolla 9-Vjeçare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">
      <span class="brand-mark">9</span>
      <div class="brand-text">
        <strong>Orari Mësimor</strong>
        <small>Klasat 6–9 · A · B · C</small>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="saveStatus" class="save-status">Ruajtur</span>
    </div>
  </header>

  <div class="shell">
    <!-- Sidebar nav -->
    <nav class="sidebar" id="sidebar">
      <button class="nav-item active" data-tab="dashboard">
        <span class="nav-ic">◧</span> Paneli
      </button>
      <button class="nav-item" data-tab="teachers">
        <span class="nav-ic">☺</span> Mësuesit
      </button>
      <button class="nav-item" data-tab="subjects">
        <span class="nav-ic">▤</span> Lëndët
      </button>
      <button class="nav-item" data-tab="curriculum">
        <span class="nav-ic">▦</span> Kurrikula (orë/javë)
      </button>
      <button class="nav-item" data-tab="assignments">
        <span class="nav-ic">⇄</span> Caktimet
      </button>
      <button class="nav-item" data-tab="timetable">
        <span class="nav-ic">▥</span> Gjenero Orarin
      </button>
      <button class="nav-item" data-tab="master">
        <span class="nav-ic">🖶</span> Grafiku i Plotë
      </button>
      <button class="nav-item" data-tab="search">
        <span class="nav-ic">⌕</span> Kërko Mësues
      </button>
      <button class="nav-item" data-tab="settings">
        <span class="nav-ic">⚙</span> Cilësimet
      </button>
      <button class="nav-item" data-tab="database">
        <span class="nav-ic">⇵</span> Databaza
      </button>
    </nav>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main content -->
    <main class="content" id="content">

      <section class="tab-panel active" id="tab-dashboard"></section>
      <section class="tab-panel" id="tab-teachers"></section>
      <section class="tab-panel" id="tab-subjects"></section>
      <section class="tab-panel" id="tab-curriculum"></section>
      <section class="tab-panel" id="tab-assignments"></section>
      <section class="tab-panel" id="tab-timetable"></section>
      <section class="tab-panel" id="tab-master"></section>
      <section class="tab-panel" id="tab-search"></section>
      <section class="tab-panel" id="tab-settings"></section>
      <section class="tab-panel" id="tab-database"></section>

    </main>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="fileImportInput" accept="application/json" style="display:none">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
